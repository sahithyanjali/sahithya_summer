<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Sphoorthi Seva Trust</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 8px 0;
      color: #fb923c;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      max-width: 320px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 320px;
      text-align: left;
      font-size: 12px;
      margin-bottom: 20px;
    }
    .card h3 {
      margin: 0 0 8px 0;
      color: #e2e8f0;
      font-size: 13px;
    }
    .btn {
      background: #ea580c;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>You are currently offline</h1>
  <p>Sphoorthi Seva Trust works offline. Your cached donation ledger and volunteer guidelines remain available.</p>

  <div class="card">
    <h3>Emergency Contacts</h3>
    <div>Emergency Blood Drive Helpline: <strong>+91 98450 12345</strong></div>
    <div style="margin-top: 6px;">Rural Annadana Relief Dispatch: <strong>+91 98450 67890</strong></div>
  </div>

  <button class="btn" onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
