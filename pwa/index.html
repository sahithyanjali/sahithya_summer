<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sphoorthi Seva Trust — Progressive Web App</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sphoorthi Seva">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: linear-gradient(135deg, #ea580c, #c2410c); padding: 16px; border-bottom: 1px solid #9a3412; }
    .header-top { display: flex; align-items: center; justify-content: space-between; }
    .badge { font-size: 10px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 6px; font-weight: bold; }
    .main-content { padding: 16px; flex: 1; max-width: 600px; margin: 0 auto; width: 100%; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .stat-box { background: #0f172a; padding: 12px; border-radius: 10px; border: 1px solid #334155; }
    .stat-num { font-size: 20px; font-weight: 900; color: #22c55e; margin-top: 4px; }
    .btn { display: block; width: 100%; background: #ea580c; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 14px; text-align: center; cursor: pointer; text-decoration: none; margin-top: 8px; }
    #pwa-install-banner { display: none; background: #3b82f6; color: white; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; align-items: center; justify-content: space-between; }
    .status-online { font-size: 11px; color: #4ade80; margin-bottom: 12px; }
    .status-offline { font-size: 11px; color: #fb923c; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div>
        <h1 style="font-size: 18px; font-weight: 900;">Sphoorthi Seva Trust</h1>
        <p style="font-size: 11px; opacity: 0.9;">Progressive Web App • Installable</p>
      </div>
      <span class="badge">Reg: 402/2021</span>
    </div>
  </header>

  <main class="main-content">
    <div id="connection-status" class="status-online">Checking connection...</div>

    <!-- PWA Install Prompt Banner -->
    <div id="pwa-install-banner">
      <div>
        <div style="font-weight: 800; font-size: 13px;">Install Sphoorthi Seva App</div>
        <div style="font-size: 11px; opacity: 0.9;">Add to home screen for instant offline access</div>
      </div>
      <button id="btn-install-pwa" style="background: white; color: #1e3a8a; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 11px; cursor: pointer;">Install</button>
    </div>

    <!-- Transparency Card -->
    <div class="card">
      <div style="font-size: 12px; font-weight: bold; color: #fb923c; text-transform: uppercase;">Live Civic Ledger</div>
      <div class="stats-row">
        <div class="stat-box">
          <div style="font-size: 10px; color: #94a3b8; text-transform: uppercase;">Total Raised</div>
          <div class="stat-num" id="pwa-raised">₹2,84,500</div>
          <div style="font-size: 9px; color: #22c55e;">80G Verified</div>
        </div>
        <div class="stat-box">
          <div style="font-size: 10px; color: #94a3b8; text-transform: uppercase;">Donors</div>
          <div class="stat-num" style="color: #38bdf8;" id="pwa-donors">48 Donors</div>
          <div style="font-size: 9px; color: #94a3b8;">100% Transparency</div>
        </div>
      </div>
      <a href="/" class="btn">Launch Full Mobile Interface →</a>
    </div>
  </main>

  <script src="pwa-app.js"></script>
</body>
</html>
