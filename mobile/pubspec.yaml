name: seva_sphoorthi_volunteer_mobile
description: "Production-ready native Flutter volunteer portal for Seva Sphoorthi NGO, scaling to ~10,000 users based on Pega GenAI Blueprint."
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_bloc: ^8.1.3
  provider: ^6.1.1
  get_it: ^7.6.4

  # Networking & Serialization
  dio: ^5.4.0
  json_annotation: ^4.8.1
  intl: ^0.19.0

  # Firebase Suite (Configured securely via backend REST / Firebase Core)
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10
  firebase_storage: ^11.6.0

  # UI, Icons, Animations & QR
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
